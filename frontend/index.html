<html lang="en">

    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#090d16" />
    <meta name="description" content="Astronaut Health Monitor — Offline-First Mission Health Dashboard for Long-Duration Spaceflight and Remote Field Stations. NASA Space Apps 2026 Prototype." />

  <body class="bg-[#090d16] text-slate-100 antialiased">

        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(err => {
            console.log('ServiceWorker registration skipped or failed in dev:', err);
          });
        });
      }
    </script>
